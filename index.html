<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Keyboard Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Keyboard Piano</h1>
  <p class="subtitle">Press A S D F G H J K to play</p>

  <div class="piano">
    <div class="key" data-key="a" data-freq="262">
      <div class="note-name">C</div>
      <div class="solfege">Do</div>
      <div class="kb-hint">A</div>
    </div>
    <div class="key" data-key="s" data-freq="294">
      <div class="note-name">D</div>
      <div class="solfege">Re</div>
      <div class="kb-hint">S</div>
    </div>
    <div class="key" data-key="d" data-freq="330">
      <div class="note-name">E</div>
      <div class="solfege">Mi</div>
      <div class="kb-hint">D</div>
    </div>
    <div class="key" data-key="f" data-freq="349">
      <div class="note-name">F</div>
      <div class="solfege">Fa</div>
      <div class="kb-hint">F</div>
    </div>
    <div class="key" data-key="g" data-freq="392">
      <div class="note-name">G</div>
      <div class="solfege">Sol</div>
      <div class="kb-hint">G</div>
    </div>
    <div class="key" data-key="h" data-freq="440">
      <div class="note-name">A</div>
      <div class="solfege">La</div>
      <div class="kb-hint">H</div>
    </div>
    <div class="key" data-key="j" data-freq="494">
      <div class="note-name">B</div>
      <div class="solfege">Ti</div>
      <div class="kb-hint">J</div>
    </div>
    <div class="key" data-key="k" data-freq="523">
      <div class="note-name">C</div>
      <div class="solfege">Do</div>
      <div class="kb-hint">K</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
